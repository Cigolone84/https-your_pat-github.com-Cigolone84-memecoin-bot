<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-label="Claude Opus 4.8 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A18"/>
      <stop offset="1" stop-color="#2B2A27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#E89B82"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="1000" cy="120" r="320" fill="#D97757" opacity="0.10"/>
  <circle cx="1080" cy="520" r="220" fill="#D97757" opacity="0.07"/>

  <!-- Accent bar -->
  <rect x="80" y="150" width="96" height="8" rx="4" fill="url(#accent)"/>

  <!-- Eyebrow -->
  <text x="80" y="135" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#D97757">ANTHROPIC</text>

  <!-- Headline -->
  <text x="78" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="#F5F3EE">Claude</text>
  <text x="78" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="url(#accent)">Opus 4.8</text>

  <!-- Subhead -->
  <text x="80" y="440" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#C9C5BD">Più affidabile. Più trasparente. Più utile.</text>

  <!-- Stat chips -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="80" y="486" width="300" height="78" rx="14" fill="#ffffff" opacity="0.06"/>
    <text x="100" y="520" font-size="30" font-weight="700" fill="#F5F3EE">84%</text>
    <text x="100" y="548" font-size="18" fill="#A8A49B">Online-Mind2Web · #1</text>

    <rect x="400" y="486" width="300" height="78" rx="14" fill="#ffffff" opacity="0.06"/>
    <text x="420" y="520" font-size="30" font-weight="700" fill="#F5F3EE">4×</text>
    <text x="420" y="548" font-size="18" fill="#A8A49B">meno errori non segnalati</text>

    <rect x="720" y="486" width="300" height="78" rx="14" fill="#ffffff" opacity="0.06"/>
    <text x="740" y="520" font-size="30" font-weight="700" fill="#F5F3EE">$5 / $25</text>
    <text x="740" y="548" font-size="18" fill="#A8A49B">prezzo invariato · 1M token</text>
  </g>
</svg>
